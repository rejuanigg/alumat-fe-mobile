services:
  expo:
    build: .
    working_dir: /app
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true

volumes:
  node_modules: